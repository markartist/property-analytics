# Cloudflare Edge Delivery Analytics
#
# Source contract:
# - Uses Cloudflare GraphQL Analytics API (`httpRequestsAdaptiveGroups`).
# - Stores daily source facts in the canonical Data Pond DB.
# - Does not replace GA4, Heap, GSC, Portfolio Pulse, or Insights Engine reads.

graphql:
  enabled: true
  timeout_seconds: 30
  max_retries: 2
  use_previous_day_window: true
  top_paths_limit: 25

account_id_env: "CLOUDFLARE_ACCOUNT_ID"
zone_ids_env: "CLOUDFLARE_ZONE_IDS"

