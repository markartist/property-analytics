  <text x="1068" y="278" text-anchor="middle" class="box-text">WP Engine-origin path for Cendana</text>

  <rect x="1245" y="195" width="255" height="116" class="box"/>
  <text x="1373" y="226" text-anchor="middle" class="box-title">Platform surfaces</text>
  <text x="1373" y="252" text-anchor="middle" class="box-text">app.venterradev.com</text>
  <text x="1373" y="278" text-anchor="middle" class="box-text">api.venterradev.com</text>

  <rect x="940" y="360" width="255" height="116" class="box-muted"/>
  <text x="1068" y="391" text-anchor="middle" class="box-title">Workers</text>
  <text x="1068" y="417" text-anchor="middle" class="box-text">pop-brief-api</text>
  <text x="1068" y="439" text-anchor="middle" class="box-text">Edge message and Resi Edge pilots</text>

  <rect x="1245" y="360" width="255" height="116" class="box-data"/>
  <text x="1373" y="391" text-anchor="middle" class="box-title">Cloudflare storage</text>
  <text x="1373" y="417" text-anchor="middle" class="box-text">D1 pop-brief-db</text>
  <text x="1373" y="439" text-anchor="middle" class="box-text">R2 pop-brief-uploads / resi-edge-assets</text>

  <rect x="940" y="525" width="560" height="78" class="box-muted"/>
  <text x="1220" y="556" text-anchor="middle" class="box-title">Zaraz and edge analytics</text>
  <text x="1220" y="582" text-anchor="middle" class="box-text">GA4, Heap / Contentsquare, Ahrefs, Cloudflare Analytics, billable usage</text>

  <rect x="60" y="705" width="980" height="235" class="section"/>
  <text x="82" y="738" class="section-label">Measurement, Data Pond, and Outputs</text>
  <rect x="100" y="780" width="230" height="100" class="box-data"/>
  <text x="215" y="811" text-anchor="middle" class="box-title">Source facts</text>
  <text x="215" y="837" text-anchor="middle" class="box-text">GA4, GSC, GBP, Ahrefs</text>
  <text x="215" y="859" text-anchor="middle" class="box-text">DataForSEO, PageSpeed / CrUX</text>

  <rect x="390" y="780" width="210" height="100" class="box-data"/>
  <text x="495" y="811" text-anchor="middle" class="box-title">Data Collection</text>
  <text x="495" y="837" text-anchor="middle" class="box-text">Daily master collection</text>
  <text x="495" y="859" text-anchor="middle" class="box-text">and source collectors</text>

  <rect x="660" y="780" width="210" height="100" class="box-data"/>
  <text x="765" y="811" text-anchor="middle" class="box-title">Local Data Pond</text>
  <text x="765" y="837" text-anchor="middle" class="box-text">portfolio_analytics.db</text>
  <text x="765" y="859" text-anchor="middle" class="box-text">selected D1 mirror sync</text>

  <rect x="545" y="898" width="190" height="28" fill="#7DCAC2" stroke="#3B9189" stroke-width="2" rx="8"/>
  <text x="640" y="918" text-anchor="middle" class="small">Watchtower health checks</text>

  <rect x="780" y="898" width="220" height="28" fill="#FFFFFF" stroke="#BD4830" stroke-width="2" rx="8"/>
  <text x="890" y="918" text-anchor="middle" class="small">PIB, reports, audits, run packets</text>

  <rect x="1080" y="705" width="460" height="235" class="section"/>
  <text x="1102" y="738" class="section-label">Governance and Operating Model</text>
  <rect x="1120" y="780" width="180" height="66" class="box"/>
  <text x="1210" y="808" text-anchor="middle" class="box-title">Technology</text>
  <text x="1210" y="829" text-anchor="middle" class="small">account, DNS, Access</text>
  <text x="1210" y="844" text-anchor="middle" class="small">security, registrar</text>

  <rect x="1320" y="780" width="180" height="66" class="box"/>
  <text x="1410" y="808" text-anchor="middle" class="box-title">Marketing Ops</text>
  <text x="1410" y="829" text-anchor="middle" class="small">WebOps, SEO, Workers</text>
  <text x="1410" y="844" text-anchor="middle" class="small">analytics</text>

  <rect x="1120" y="870" width="180" height="42" class="box-muted"/>
  <text x="1210" y="897" text-anchor="middle" class="box-title">Keeper</text>

  <rect x="1320" y="870" width="180" height="42" class="box-muted"/>
  <text x="1410" y="897" text-anchor="middle" class="box-title">Website vendor</text>

