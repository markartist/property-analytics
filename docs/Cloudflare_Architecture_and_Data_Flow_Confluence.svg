<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Architecture and Data Flow</title>
  <desc id="desc">Venterra web operation architecture showing domain ownership, Cloudflare edge control, delivery surfaces, measurement collection, Data Pond storage, operating outputs, and governance roles.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#294782"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3B9189"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #15284B; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; }
      .section-label { font-size: 18px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-text { font-size: 14px; }
      .small { font-size: 12px; }
      .section { fill: #F6F6F5; stroke: #3D66B9; stroke-width: 2; rx: 8; }
      .box { fill: #FFFFFF; stroke: #294782; stroke-width: 2; rx: 8; }
      .box-muted { fill: #D6D6D2; stroke: #294782; stroke-width: 2; rx: 8; }
      .box-cloudflare { fill: #15284B; stroke: #3D66B9; stroke-width: 3; rx: 8; }
      .box-data { fill: #7DCAC2; stroke: #3B9189; stroke-width: 2; rx: 8; }
      .box-output { fill: #FFFFFF; stroke: #BD4830; stroke-width: 3; rx: 8; }
      .arrow { fill: none; stroke: #294782; stroke-width: 3; marker-end: url(#arrow-navy); }
      .arrow-data { fill: none; stroke: #3B9189; stroke-width: 3; marker-end: url(#arrow-teal); }
      .dash { fill: none; stroke: #294782; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <text x="60" y="58" class="title">Cloudflare Architecture and Data Flow</text>
  <text x="60" y="88" class="subtitle">Venterra web operations path from domain ownership through edge delivery, platform Workers, measurement, Data Pond, and operating outputs.</text>

  <rect x="60" y="125" width="280" height="215" class="section"/>
  <text x="82" y="158" class="section-label">External Demand</text>
  <rect x="92" y="208" width="216" height="86" class="box"/>
  <text x="200" y="237" text-anchor="middle" class="box-title">Public users</text>
  <text x="200" y="263" text-anchor="middle" class="box-text">Search crawlers</text>
  <text x="200" y="285" text-anchor="middle" class="box-text">Prospects</text>

  <rect x="380" y="125" width="480" height="525" class="section"/>
  <text x="402" y="158" class="section-label">Domain and Edge Control</text>
  <rect x="435" y="195" width="370" height="78" class="box-muted"/>
  <text x="620" y="226" text-anchor="middle" class="box-title">GoDaddy / registrar portfolio</text>
  <text x="620" y="251" text-anchor="middle" class="box-text">284-domain snapshot</text>

  <rect x="435" y="314" width="370" height="94" class="box-cloudflare"/>
  <text x="620" y="347" text-anchor="middle" class="box-title" fill="#FFFFFF">Cloudflare account</text>
  <text x="620" y="373" text-anchor="middle" class="box-text" fill="#FFFFFF">5a5a60afaad00085864fe6bab7eb2882</text>

  <rect x="435" y="450" width="370" height="92" class="box-muted"/>
  <text x="620" y="483" text-anchor="middle" class="box-title">Cloudflare DNS and zone folders</text>
  <text x="620" y="509" text-anchor="middle" class="box-text">Nameservers, records, SSL validation</text>

  <rect x="435" y="584" width="370" height="62" class="box-muted"/>
  <text x="620" y="611" text-anchor="middle" class="box-title">Cloudflare edge behavior</text>
  <text x="620" y="634" text-anchor="middle" class="box-text">Proxy, redirects, cache rules, WAF posture</text>

  <rect x="900" y="125" width="640" height="525" class="section"/>
