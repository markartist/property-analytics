name = "ops-watch-ingest"
main = "worker.js"
compatibility_date = "2026-08-01"
account_id = "5a5a60afaad00085864fe6bab7eb2882"
workers_dev = false

routes = [
  { pattern = "ops-watch.venterrawebops.com", custom_domain = true }
]

[[d1_databases]]
binding = "POP_BRIEF_DB"
database_name = "pop-brief-db"
database_id = "dad3e7d1-147b-438d-8cd0-2cbf537a87b2"

[[r2_buckets]]
binding = "POP_BRIEF_UPLOADS"
bucket_name = "pop-brief-uploads"

[vars]
OPS_WATCH_INGEST_ENABLED = "true"
OPS_WATCH_INGEST_ALLOWED_SOURCES = "intranet_it_help,intranet_ops,jira_mirror,sharepoint_mirror,ms365_graph_mirror"
OPS_WATCH_INGEST_MAX_BYTES = "1048576"
OPS_WATCH_INGEST_MAX_RECORDS = "500"
OPS_WATCH_INGEST_SCHEMA_VERSION = "ops-watch-ingest-v1"

# Secrets, set through Keeper-backed deployment flow only:
# OPS_WATCH_INGEST_SHARED_SECRET
