name = "captain-refresh"
main = "worker.js"
compatibility_date = "2026-08-01"
account_id = "5a5a60afaad00085864fe6bab7eb2882"
workers_dev = false

routes = [
  { pattern = "captain-refresh.venterrawebops.com", custom_domain = true }
]

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "POP_BRIEF_DB"
database_name = "pop-brief-db"
database_id = "dad3e7d1-147b-438d-8cd0-2cbf537a87b2"

[[r2_buckets]]
binding = "POP_BRIEF_UPLOADS"
bucket_name = "pop-brief-uploads"

[vars]
CAPTAIN_REFRESH_ENABLED = "true"
CAPTAIN_REFRESH_FAMILY_DUE_DATE = "2026-09-07"
CAPTAIN_REFRESH_MAX_PROPERTIES = "150"
CAPTAIN_REFRESH_SCHEMA_VERSION = "captain-refresh-v1"

# Optional secret for manual POST /v1/captains/refresh/run.
# Set only through Keeper-backed deployment flow:
# CAPTAIN_REFRESH_ADMIN_SECRET
