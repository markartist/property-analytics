name = "edge-transparent-pricing-intro-beta"
main = "worker.js"
compatibility_date = "2024-12-01"
workers_dev = false

routes = [
  { pattern = "pilot.venterradev.com/*", zone_name = "venterradev.com" }
]

[vars]
EDGE_MESSAGE_INJECTION_ENABLED = "false"
EDGE_COACH_MARK_INJECTION_ENABLED = "true"
EDGE_HERO_MOBILE_IMAGE_ENABLED = "true"
EDGE_HERO_MOBILE_PRELOAD_ENABLED = "false"
EDGE_HERO_MOBILE_CRITICAL_CSS_ENABLED = "false"
EDGE_MOBILE_IMAGE_REPLACEMENTS_ENABLED = "true"
EDGE_HOME_HTML_CACHE_ENABLED = "true"
EDGE_HOME_HTML_CACHE_VERSION = "2026-07-17-zaraz-cmp-passive-notice-v6"
EDGE_ZARAZ_CONSENT_NOTICE_ENABLED = "true"
EDGE_HOME_STATIC_SHELL_ENABLED = "true"
EDGE_FONT_DISPLAY_REWRITE_ENABLED = "true"
EDGE_HOMEPAGE_ASSET_TRIM_ENABLED = "true"
EDGE_HOMEPAGE_DUPLICATE_CSS_REMOVAL_ENABLED = "true"
EDGE_HOMEPAGE_FILTERS_REMOVAL_ENABLED = "true"
EDGE_HOMEPAGE_CUSTOM_JS_DEFER_ENABLED = "true"
EDGE_HOMEPAGE_YOOTHEME_ICONS_THEME_DEFER_ENABLED = "true"
EDGE_HOMEPAGE_JQUERY_MIGRATE_REMOVAL_ENABLED = "true"
EDGE_HERO_VIEWPORT_HEIGHT_REMOVAL_ENABLED = "true"
EDGE_HOME_STATIC_HERO_ENABLED = "true"
EDGE_HOME_RESI_PIXEL_IDLE_ENABLED = "true"
EDGE_HOME_RESI_PIXEL_IDLE_DELAY_MS = "1750"
EDGE_MESSAGE_MOBILE_AFTER_LOAD_DELAY_MS = "0"
EDGE_MESSAGE_MOBILE_AFTER_LOAD_IDLE_TIMEOUT_MS = "2500"
EDGE_MESSAGE_MOBILE_SCROLL_TRIGGER_ENABLED = "true"
EDGE_MESSAGE_MOBILE_SCROLL_TRIGGER_PX = "360"
EDGE_MESSAGE_MOBILE_SCROLL_TRIGGER_DELAY_MS = "350"

[[d1_databases]]
binding = "POP_BRIEF_DB"
database_name = "pop-brief-db"
database_id = "dad3e7d1-147b-438d-8cd0-2cbf537a87b2"
