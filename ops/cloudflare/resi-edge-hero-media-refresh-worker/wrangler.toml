name = "resi-edge-hero-media-refresh"
main = "worker.mjs"
compatibility_date = "2024-12-01"
account_id = "5a5a60afaad00085864fe6bab7eb2882"
workers_dev = false

[[r2_buckets]]
binding = "RESI_EDGE_ASSETS"
bucket_name = "resi-edge-assets"

[images]
binding = "IMAGES"

[[queues.consumers]]
queue = "resi-edge-hero-media-refresh"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "resi-edge-hero-media-refresh-dlq"

[vars]
RESI_EDGE_HERO_MEDIA_REFRESH_MODE = "disabled"
RESI_EDGE_HERO_MEDIA_CANARY_ALLOWLIST = ""
