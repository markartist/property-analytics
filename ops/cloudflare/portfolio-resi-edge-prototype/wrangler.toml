name = "portfolio-resi-edge-prototype"
main = "worker.js"
compatibility_date = "2024-12-01"
account_id = "5a5a60afaad00085864fe6bab7eb2882"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.svg"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.avif"]
fallthrough = true

[[r2_buckets]]
binding = "RESI_EDGE_ASSETS"
bucket_name = "resi-edge-assets"

[vars]
EDGE_SHELL_ENABLED = "false"
EDGE_PREVIEW_PARAM = "edge_preview"
EDGE_PREVIEW_VALUE = "1"
EDGE_HTML_CACHE_ENABLED = "true"
EDGE_HTML_CACHE_VERSION = "champions-locked-mobile-upgrade-contract"
EDGE_HTML_CACHE_TTL_SECONDS = "300"
EDGE_NATIVE_PROPERTY_SYNC_ENABLED = "true"
EDGE_RUNTIME_PROPERTY_CACHE_VERSION = "2026-08-08-native-specials-v3"
EDGE_RUNTIME_PROPERTY_CACHE_TTL_SECONDS = "300"
