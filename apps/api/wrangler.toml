name = "pop-brief-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain (ADR-0001: api.venterradev.com; Data Pond target: api.venterrawebops.com)
# routes = [{ pattern = "api.venterradev.com", custom_domain = true }]

[triggers]
crons = ["*/15 * * * *"]

# D1 Database binding
[[d1_databases]]
binding = "POP_BRIEF_DB"
database_name = "pop-brief-db"
database_id = "dad3e7d1-147b-438d-8cd0-2cbf537a87b2"

# R2 Object Storage binding
[[r2_buckets]]
binding = "POP_BRIEF_UPLOADS"
bucket_name = "pop-brief-uploads"

[[r2_buckets]]
binding = "RESI_EDGE_ASSETS"
bucket_name = "resi-edge-assets"

[[queues.producers]]
binding = "RESI_EDGE_HERO_MEDIA_REFRESH_QUEUE"
queue = "resi-edge-hero-media-refresh"

# Environment variables
[vars]
ENABLE_EMAIL_SEND = "true"
RESI_EDGE_PROMO_SYNC_ENABLED = "true"
RESI_EDGE_PROMO_FEED_URL = "https://online.venterraliving.com/encasa-external/ThirtyLines"
RESI_EDGE_HERO_FRESHNESS_SYNC_ENABLED = "true"
RESI_EDGE_HERO_MEDIA_QUEUE_ENABLED = "false"
MAGIC_LINK_ALLOWED_DOMAINS = "venterraliving.com,venterra.com"
MAGIC_LINK_AUTO_PROVISION_ENABLED = "true"
MAGIC_LINK_AUTO_PROVISION_PATH_PREFIXES = "/resi-edge/launch"
MAGIC_LINK_DEFAULT_ROLE = "viewer"
CLOUDFLARE_ACCESS_TEAM_DOMAIN = "https://macxs.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUD = "fca46340e8500d1e18908389c73c1bf91bcd31cbf646b376cc7253cac34c3c1f,9d4bd18c834cfee63d2b711125dfd84e315d48273646b191d899ca46defaba88,79f44b0772c082deba6c23bf4838b9e86dd7df399071a8b246d68d1ed72e3786,804cbc253d28b46f294e7c7d0012a17c9e2ab6e9201bf608998c32dd34fb2008,1e70e426437fb628f3f23743f00c09e80483bc0c578e78207a470dc12138df4c,78600ac7ffc501b16f4cdf3ae225cfa1c9539f7c10e64084ee02dcc16967bb37,bf3a1b14afb40237d6fa0e3c1d55874932fa13a3d40a7c4d06c22d6fdfe95fc3,761ac42c7ade7aacdd452c5e38534a1e15a61fd094cce44e60758ad0851ec4c3"
